name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Free space for Nix: https://github.com/actions/runner-images/issues/14558.
      - name: Free up disk space for Nix
        uses: wimpysworld/nothing-but-nix@v10

      - name: Install Nix
        uses: cachix/install-nix-action@v27

      - name: Check Nix shell and formatting
        run: |
          nix-shell --run '
            set -euo pipefail
            test "$SQLAD_EXTRA" = cpu
            test "$UV_PROJECT_ENVIRONMENT" = "$PWD/.venv-nix-cpu"
            test "$UV_PYTHON_DOWNLOADS" = never
            test "$UV_PYTHON_PREFERENCE" = only-system
            command -v python
            command -v uv
            command -v treefmt
            command -v ruff
            treefmt --fail-on-change
            ruff check .
          '

      - name: Check submit environment
        run: nix-shell nix/ci-env.nix --run "bash -e -c '. tools/setup-env.sh submit'"

      - name: Run tests, coverage, and build docs
        run: |
          nix-shell nix/ci-env.nix --run "
            set -euo pipefail
            uv lock --check
            uv export --no-dev --no-emit-project -o requirements.txt
            git diff --exit-code requirements.txt
            uv run --frozen --extra cpu coverage run -m pytest tests/ --skip-slow
            uv run --frozen --extra cpu coverage report -m
            uv run --frozen --extra cpu mkdocs build --strict --config-file docs/mkdocs.yaml --site-dir build
          "
