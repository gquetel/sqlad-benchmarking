name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Run tests & coverage
        run: |
          nix-shell --run "
            python -m venv .venv
            source .venv/bin/activate
            pip install -r requirements.txt
            pip install pytest==8.3.4 coverage==7.8.0
            coverage run -m pytest tests/
            coverage report -m
          "
