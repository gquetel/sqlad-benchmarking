[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlad_benchmarking"
version = "0.0.1"
description = "Unsupervized SQL attack detection with MLflow tracking."
authors = [
  { name = "gquetel", email = "gregor.quetel@telecom-paris.fr" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = "==3.14.3"
dependencies = [
  "joblib",
  "mlflow-skinny==3.14",  # Match the tracking server.
  "python-dotenv",
  "numpy",
  "pandas",
  "scikit-learn",
  "transformers==5.12.0",
  "sentence-transformers",
  "typer",
  "plotly",
  "kaleido",
  "gaur-sql-detect",
  "sqlparse",
  "peft>=0.20.0",
]

[project.optional-dependencies]
# Select cu126 for V100/A100/A40/A30, cu130 for RTX6000PRO (Blackwell), or cpu without a GPU.
cu126 = ["torch==2.12.0"]
cu130 = ["torch==2.12.0"]
cpu = ["torch==2.12.0"]

[dependency-groups]
# Dependencies for the torch-free SLURM submit environment.
submit = [
  "mlflow-skinny==3.14",
  "pandas",
  "python-dotenv",
  "pyyaml",
  "typer",
]
dev = [
  "pytest",
  "coverage",
  "mypy",
  "invoke",
  "mkdocs-material",
  "mkdocstrings-python",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
  "slow: downloads or runs a heavy embedding model; pass --skip-slow to deselect",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
  "B",   # Likely bugs and design problems (flake8-bugbear)
  "E",   # PEP 8 codestyle errors
  "N",   # PEP 8 Variable naming convention
  "S",   # Security rules (flake8-bandit) 
  "W",   # PEP 8 codestyle  warnings
  "I",   # Sort imports properly (isort)
]

[tool.ruff.lint.per-file-ignores]
# assert is acceptable in testing code (not invoked with optimization)
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["src/sqlad_benchmarking"]
omit = ["tests/*"]

[tool.uv]
conflicts = [[{ extra = "cu126" }, { extra = "cu130" }, { extra = "cpu" }]]

[tool.uv.sources]
gaur-sql-detect = { git = "https://github.com/gquetel/gaur-sql-detect", rev = "60c3c228d08ad1bec61739e1976da1178f0ae2fa" }
# Separate PyTorch builds support V100 and Blackwell GPUs; see docs/source/slurm.md.
torch = [
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
