# SLURM site settings for tools/slurm_submit.py

cpu:
  partition: CPU
  cpus_per_task: 32
  mem: 32G
  time: "12:00:00"

gpu:
  gres: gpu:1
  cpus_per_task: 32
  mem: 64G
  time: "12:00:00"
  # GPU memory in GB, in preference order. Jobs can use any partition with enough memory.
  partitions:
    RTX6000PRO: 96
    A100: 40
    A40: 46
    A30: 24
    V100-32GB: 32
    V100-16GB: 16

gpu-long:
  gres: gpu:1
  cpus_per_task: 32
  mem: 64G
  time: "24:00:00"
  partitions:
    RTX6000PRO: 96
    A100: 40
    A40: 46
    A30: 24
    V100-32GB: 32
    V100-16GB: 16

gpu_arch:
  RTX6000PRO: sm_120
  A100: sm_80
  A40: sm_86
  A30: sm_80
  V100-32GB: sm_70
  V100-16GB: sm_70

# Each build lists its Python environment, uv extra, and supported GPU architectures.
# GPU jobs use the first matching build; CPU jobs use env below.
# Build each environment with tools/setup-env.sh; see docs/source/slurm.md.
cuda_builds:
  cu126:
    venv: .venv-cluster-cu126
    extra: cu126
    arch: [sm_70, sm_75, sm_80, sm_86, sm_90]
  cu130:
    venv: .venv-cluster-cu130
    extra: cu130
    arch: [sm_75, sm_80, sm_86, sm_90, sm_100, sm_120]

# Required GPU memory in GB. A method:extractor entry overrides an extractor entry.
min_vram_gb:
  default: 0
  codet5: 32
  qwen3-emb: 24
  llm2vec: 32

# GPU partitions permitted for an extractor. Unlisted extractors use any partition with enough memory.
allowed_partitions:
  llm2vec: [RTX6000PRO, A100]

# Extractors or method:extractor pairs that use the gpu-long time limit.
long_running:
  - ocsvm:sbert
  - sbert2
  - qwen3-emb
  - llm2vec

# Compute-node environment settings.
env:
  # Python environment used by CPU tasks.
  venv: .venv-cluster-cpu
  extra: cpu
  # System modules to load before activating Python; none are required here.
  modules: []
